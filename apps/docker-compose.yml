version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  temperature-api:
    build: ./temperature
    container_name: temperature-api
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data
      - ./telemetry/init_telemetry.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  telemetry-api:
    build: ./telemetry
    container_name: telemetry-api
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      telemetry-postgres:
        condition: service_healthy
    networks:
      - smarthome-network

  devices-api:
    build: ./devices
    container_name: devices-api
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network


  smarthome-app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      telemetry-api:
        condition: service_started
      devices-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - TELEMETRY_API_URL=http://telemetry-api:8082
      - DEVICES_API_URL=http://devices-api:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  telemetry_postgres_data:

networks:
  smarthome-network:
    driver: bridge